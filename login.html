<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #141418;
      color: white;
    }

    .login-card {
      width: 360px;
      padding: 35px 40px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 15px;
    }

    .login-card h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .login-card label {
      display: block;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .login-card input {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      margin-bottom: 18px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.5);
      font-size: 15px;
    }

    .login-card button {
      width: 100%;
      height: 42px;
      margin-top: 5px;
      border: none;
      border-radius: 6px;
      background-color: red;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .bottom-text {
      text-align: center;
      margin-top: 18px;
      font-size: 15px;
    }

    .bottom-text a {
      color: red;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1>Netflex , Login</h1>

    <label>Email Address</label>
    <input type="email">

    <label>Password</label>
    <input type="password">

    <button>REGISTER</button>

    <p class="bottom-text">Dont have an account? <a href="#">Create account?</a></p>
  </div>

</body>
</html>
